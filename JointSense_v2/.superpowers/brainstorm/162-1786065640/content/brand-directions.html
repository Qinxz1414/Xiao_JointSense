<style>
  #jointsense-brand-directions {
    --js-ink: #0E2841;
    --js-primary: #156082;
    --js-cyan: #0F9ED5;
    --js-green: #196B24;
    --js-well: #7B9694;
    --js-canvas: #F7F9FA;
  }
  #jointsense-brand-directions .brand-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  #jointsense-brand-directions .brand-card {
    cursor: pointer;
  }
  #jointsense-brand-directions .logo-stage {
    min-height: 250px;
    display: grid;
    place-items: center;
    gap: 14px;
    padding: 24px 18px;
    background: light-dark(#F7F9FA, #132331);
  }
  #jointsense-brand-directions .app-icon {
    width: 132px;
    height: 132px;
    border-radius: 30px;
    display: grid;
    place-items: center;
    background: light-dark(#FFFFFF, #F7F9FA);
    box-shadow: 0 14px 34px rgba(14,40,65,.14);
  }
  #jointsense-brand-directions .app-icon svg {
    width: 96px;
    height: 96px;
  }
  #jointsense-brand-directions .wordmark {
    color: light-dark(var(--js-ink), #F7F9FA);
    font-family: Inter, system-ui, sans-serif;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -.03em;
  }
  #jointsense-brand-directions .wordmark span {
    color: var(--js-primary);
  }
  #jointsense-brand-directions .tag {
    display: inline-block;
    margin-bottom: 8px;
    color: var(--js-primary);
    font-weight: 500;
  }
  #jointsense-brand-directions .recommended {
    color: var(--js-green);
  }
  @media (max-width: 780px) {
    #jointsense-brand-directions .brand-grid { grid-template-columns: 1fr; }
  }
</style>

<div id="jointsense-brand-directions">
  <h2>JointSense 品牌方向</h2>
  <p class="subtitle">请选择最符合“关节炎症检测 + 手机视觉分析”的方向；三款都摒弃旧 Logo 的紫色芯片符号。</p>

  <div class="brand-grid cards">
    <div class="card brand-card" data-choice="a-joint-signal" onclick="toggleSelect(this)">
      <div class="card-image logo-stage">
        <div class="app-icon" aria-label="关节信号 Logo 预览">
          <svg viewBox="0 0 100 100" role="img" aria-label="两段关节与炎症信号环">
            <path d="M24 29c7-10 20-14 31-9 5 2 10 7 13 12" fill="none" stroke="var(--js-primary)" stroke-width="9" stroke-linecap="round"/>
            <path d="M76 71c-7 10-20 14-31 9-5-2-10-7-13-12" fill="none" stroke="var(--js-cyan)" stroke-width="9" stroke-linecap="round"/>
            <circle cx="25" cy="30" r="10" fill="none" stroke="var(--js-ink)" stroke-width="6"/>
            <circle cx="75" cy="70" r="10" fill="none" stroke="var(--js-ink)" stroke-width="6"/>
            <circle cx="50" cy="50" r="12" fill="var(--js-well)" opacity=".35"/>
            <circle cx="50" cy="50" r="5" fill="var(--js-green)"/>
          </svg>
        </div>
        <div class="wordmark">Joint<span>Sense</span></div>
      </div>
      <div class="card-body">
        <span class="tag">A · 关节信号</span>
        <h3>医疗属性最强</h3>
        <p>把两端骨关节、中央滑液检测孔和信号环合为一体，容易传达“关节炎症监测”。</p>
      </div>
    </div>

    <div class="card brand-card" data-choice="b-well-scan" onclick="toggleSelect(this)">
      <div class="card-image logo-stage">
        <div class="app-icon" aria-label="孔板扫描 Logo 预览">
          <svg viewBox="0 0 100 100" role="img" aria-label="三个检测孔与扫描框">
            <path d="M18 37V23c0-3 2-5 5-5h14M63 18h14c3 0 5 2 5 5v14M82 63v14c0 3-2 5-5 5H63M37 82H23c-3 0-5-2-5-5V63" fill="none" stroke="var(--js-primary)" stroke-width="7" stroke-linecap="round"/>
            <circle cx="34" cy="50" r="10" fill="none" stroke="var(--js-ink)" stroke-width="5"/>
            <circle cx="50" cy="50" r="10" fill="var(--js-cyan)" opacity=".32" stroke="var(--js-cyan)" stroke-width="5"/>
            <circle cx="66" cy="50" r="10" fill="var(--js-green)" opacity=".30" stroke="var(--js-green)" stroke-width="5"/>
            <path d="M30 68h40" stroke="var(--js-well)" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="wordmark">Joint<span>Sense</span></div>
      </div>
      <div class="card-body">
        <span class="tag recommended">B · 检测孔扫描（推荐）</span>
        <h3>产品识别度最准确</h3>
        <p>三个孔对应三种炎症因子，四角表达手机取景与自动分析；缩小到启动图标仍然清楚。</p>
      </div>
    </div>

    <div class="card brand-card" data-choice="c-j-monogram" onclick="toggleSelect(this)">
      <div class="card-image logo-stage">
        <div class="app-icon" aria-label="J 字趋势 Logo 预览">
          <svg viewBox="0 0 100 100" role="img" aria-label="字母 J 与趋势点阵">
            <path d="M66 20v43c0 13-9 21-22 21-10 0-18-5-22-13" fill="none" stroke="var(--js-primary)" stroke-width="10" stroke-linecap="round"/>
            <path d="M25 57l14-11 13 7 18-20" fill="none" stroke="var(--js-cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="25" cy="57" r="5" fill="var(--js-ink)"/>
            <circle cx="39" cy="46" r="5" fill="var(--js-well)"/>
            <circle cx="52" cy="53" r="5" fill="var(--js-green)"/>
            <circle cx="70" cy="33" r="5" fill="var(--js-cyan)"/>
          </svg>
        </div>
        <div class="wordmark">Joint<span>Sense</span></div>
      </div>
      <div class="card-body">
        <span class="tag">C · J 趋势字标</span>
        <h3>数字健康感最强</h3>
        <p>用 J 字母承载趋势折线，简洁现代，更像长期健康管理产品，但 ELISA 特征较弱。</p>
      </div>
    </div>
  </div>
</div>
